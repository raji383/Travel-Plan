services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm start -- --host 0.0.0.0"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  api-gateway:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      SERVER_PORT: 8080
    volumes:
      - ./backend/api-gateway:/app
      - maven_repository:/root/.m2

  eureka:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    volumes:
      - ./backend/eureka:/app
      - maven_repository:/root/.m2

  users:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      SERVER_PORT: 8081
    volumes:
      - ./backend/users:/app
      - maven_repository:/root/.m2

  travel:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      SERVER_PORT: 8082
    volumes:
      - ./backend/Travel:/app
      - maven_repository:/root/.m2

  payment:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      SERVER_PORT: 8083
    volumes:
      - ./backend/Payment:/app
      - maven_repository:/root/.m2

volumes:
  frontend_node_modules:
  maven_repository: